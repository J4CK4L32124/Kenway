name: release

# Push a version tag (e.g. v1.0.1) and this builds the exe and publishes a
# GitHub Release. Every install worldwide then auto-updates on next launch.
#   npm version patch   # bumps package.json and creates the git tag
#   git push && git push --tags

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build executable
        run: npm run build

      - name: Package plugins
        shell: pwsh
        run: Compress-Archive -Path build/plugins/* -DestinationPath build/plugins.zip -Force

      - name: Include launcher as an asset
        shell: pwsh
        run: Copy-Item updater/launcher.ps1 build/launcher.ps1 -Force

      - name: Write manifest
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          @{ version = $v } | ConvertTo-Json | Set-Content build/manifest.json

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            build/kenway.exe `
            build/plugins.zip `
            build/launcher.ps1 `
            build/manifest.json `
            --title "${{ github.ref_name }}" `
            --notes "Automated release ${{ github.ref_name }}"
